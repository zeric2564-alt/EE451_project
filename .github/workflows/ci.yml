name: Renderer checks
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: make -j2
      - run: make test
      - run: make test-integration
      - run: make sanitize
      - run: python benchmarks/proposal.py --stage all --preset smoke --output results/current/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: results/current/
